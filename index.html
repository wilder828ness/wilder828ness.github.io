<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nubz Toys &amp; Collectibles • Est. 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', system_ui, sans-serif; }
        .font-display { font-family: 'Space Grotesk', 'Inter', system_ui, sans-serif; font-weight: 700; }
        .section-header { font-size: 2.5rem; line-height: 1.05; font-weight: 700; letter-spacing: -0.04em; }
        .toy-card { transition: all 0.3s ease; }
        .toy-card:hover { transform: translateY(-6px); }
        .nav-link { transition: color 0.2s ease; }
        .nav-link:hover { color: #22d3ee; }
        .page { display: none; }
        .page.active { display: block; }
        .status-badge { font-size: 0.7rem; padding: 2px 10px; font-weight: 600; letter-spacing: 0.5px; border-radius: 9999px; }
        .compare-price { text-decoration: line-through; color: #64748b; }
        img { image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges; }
        .gradient-title {
            background: linear-gradient(to right, #22d3ee, #e879f9, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200">

    <!-- NAV BAR -->
    <nav class="fixed top-0 left-0 right-0 bg-slate-950/95 backdrop-blur-xl border-b border-slate-800 z-50">
        <div class="max-w-7xl mx-auto px-6">
            <div class="flex items-center justify-between h-20">
                <div onclick="showPage('home')" class="flex items-center gap-x-3 cursor-pointer">
                    <img src="nubz-header-logo.png" alt="Nubz Toys &amp; Collectibles" class="h-14 w-auto">
                </div>

                <div class="hidden md:flex items-center gap-x-8 text-sm font-medium">
                    <a href="#" onclick="event.preventDefault(); showPage('home')" class="nav-link">Home</a>
                    <a href="#" onclick="event.preventDefault(); showPage('categories')" class="nav-link">Categories</a>
                    <a href="#" onclick="event.preventDefault(); showPage('inventory')" class="nav-link">All Inventory</a>
                    <a href="#" onclick="event.preventDefault(); showPage('about')" class="nav-link">About Us</a>
                    <a href="#" onclick="event.preventDefault(); showPage('contact')" class="nav-link">Contact Us</a>
                </div>

                <button onclick="toggleMobileMenu()" class="md:hidden text-2xl px-3">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <div class="hidden md:flex items-center gap-x-4">
                    <button onclick="showAdmin()" class="px-4 py-2 text-xs font-semibold bg-slate-800 hover:bg-slate-700 rounded-2xl flex items-center gap-x-2">
                        <i class="fa-solid fa-user-shield"></i><span>Admin</span>
                    </button>
                    <button onclick="showCart()" class="flex items-center gap-x-2 px-5 py-2.5 bg-slate-900 hover:bg-slate-800 border border-slate-700 rounded-3xl text-sm font-medium">
                        <i class="fa-solid fa-shopping-bag"></i>
                        <span id="cart-count" class="font-mono text-xs bg-slate-800 px-2 py-0.5 rounded-full">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- HOME PAGE -->
    <div id="home" class="page active pt-20">
        <section class="min-h-[100dvh] flex items-center bg-gradient-to-br from-slate-950 to-slate-900">
            <div class="max-w-5xl mx-auto px-6 text-center">
                <div class="hidden md:flex justify-center mb-8">
                    <img src="home-logo.png" alt="Nubz Toys &amp; Collectibles" class="h-32 md:h-40 w-auto drop-shadow-2xl">
                </div>
                <div class="inline-flex items-center gap-x-2 px-4 py-1.5 bg-white/10 rounded-full mb-6 border border-white/20">
                    <div class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div>
                    <span class="text-sm font-medium">Est. 2026 • Ships Worldwide</span>
                </div>
                <h1 class="text-6xl md:text-7xl font-display font-black tracking-tighter leading-none mb-6">
                    RARE FINDS.<br>
                    <span class="gradient-title">REAL FUN.</span>
                </h1>
                <p class="max-w-xl mx-auto text-2xl text-slate-300 mb-10">Premium toys, collectibles &amp; figures for every generation.</p>
                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                    <button onclick="showPage('categories')" class="px-10 py-4 bg-white text-slate-950 font-bold rounded-3xl text-lg hover:bg-slate-100">BROWSE CATEGORIES</button>
                    <button onclick="showPage('inventory')" class="px-10 py-4 border border-white/30 hover:bg-white/5 font-semibold rounded-3xl text-lg">VIEW ALL INVENTORY</button>
                </div>
            </div>
        </section>

        <section class="max-w-7xl mx-auto px-6 py-20">
            <div class="flex justify-between items-end mb-10">
                <div>
                    <div class="text-xs uppercase tracking-[2px] text-cyan-400 font-semibold mb-2">JUST LANDED</div>
                    <h2 class="section-header gradient-title">Newest Arrivals</h2>
                </div>
                <button onclick="showPage('inventory')" class="text-sm font-medium text-cyan-400 hover:text-cyan-300 flex items-center gap-x-2">VIEW ALL <i class="fa-solid fa-arrow-right"></i></button>
            </div>
            <div id="featured-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-6"></div>
        </section>
    </div>

    <!-- CATEGORIES PAGE -->
    <div id="categories" class="page pt-20 max-w-7xl mx-auto px-6 py-20">
        <div class="text-center mb-12">
            <div class="text-xs uppercase tracking-[2px] text-cyan-400 font-semibold mb-2">SHOP BY CATEGORY</div>
            <h2 class="section-header gradient-title">Find What You're Looking For</h2>
        </div>
        <div id="category-grid" class="flex flex-wrap justify-center gap-6"></div>
    </div>

    <!-- ALL INVENTORY PAGE -->
    <div id="inventory" class="page pt-20 max-w-7xl mx-auto px-6 py-12">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <div class="text-xs uppercase tracking-[2px] text-cyan-400 font-semibold mb-2">COMPLETE CATALOG</div>
                <h2 id="inventory-header" class="section-header gradient-title">All Inventory</h2>
            </div>
            <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                <input type="text" id="search-input" placeholder="Search products..." onkeyup="filterInventory()" class="bg-slate-900 border border-slate-700 rounded-2xl px-5 py-2.5 text-sm w-full md:w-72">
                <select id="sort-select" onchange="filterInventory()" class="bg-slate-900 border border-slate-700 rounded-2xl px-4 py-2.5 text-sm">
                    <option value="newest">Newest First</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                    <option value="name">Name A–Z</option>
                </select>
            </div>
        </div>
        <div id="inventory-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
    </div>

    <!-- ADMIN MODAL -->
    <div id="admin-modal" class="hidden fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-6">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl max-w-3xl w-full p-8 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-bold text-2xl">Admin Panel</h3>
                <button onclick="closeAdmin()" class="text-3xl text-slate-400 hover:text-white">×</button>
            </div>

            <div id="admin-panel" class="hidden">
                
                <!-- UPSSELL GROUPS SECTION -->
                <div class="mb-8 border border-slate-700 rounded-2xl p-6">
                    <h4 class="font-semibold text-lg mb-4">Upsell Groups</h4>
                    
                    <div class="flex gap-2 mb-4">
                        <input id="new-upsell-group-name" placeholder="Group Name (e.g. Funko Protectors)" 
                               class="flex-1 bg-slate-800 border border-slate-700 rounded-2xl px-4 py-2 text-sm">
                        <button onclick="createUpsellGroup()" 
                                class="px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl text-sm">
                            Create Group
                        </button>
                    </div>

                    <div id="upsell-groups-list" class="space-y-4"></div>
                </div>

            </div>
        </div>
    </div>

    <script>
        let products = [];
        let cart = [];
        let upsellGroups = [];
        let isAdminLoggedIn = false;

        function saveToLocalStorage() {
            localStorage.setItem('nubz_products', JSON.stringify(products));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('nubz_products');
            if (saved) products = JSON.parse(saved);
        }

        async function loadProducts() {
            loadFromLocalStorage();
            renderFeatured();
            renderInventory();
        }

        function renderFeatured() {
            const container = document.getElementById('featured-grid');
            if (!container) return;
            container.innerHTML = '';
            products.slice(0, 6).forEach(p => container.appendChild(createProductCard(p)));
        }

        function renderInventory() {
            const container = document.getElementById('inventory-grid');
            if (!container) return;
            container.innerHTML = '';
            products.forEach(p => container.appendChild(createProductCard(p)));
        }

        function createProductCard(product) {
            const card = document.createElement('div');
            card.className = 'toy-card bg-slate-950 border border-slate-700 rounded-3xl overflow-hidden cursor-pointer p-4';
            card.innerHTML = `
                <div class="font-semibold">${product.name}</div>
                <div class="text-sm text-slate-400">$${(product.price || 0).toFixed(2)}</div>
            `;
            card.onclick = () => showProductModal(product);
            return card;
        }

        function showPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(page).classList.add('active');
        }

        function showAdmin() {
            const modal = document.getElementById('admin-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('admin-panel').classList.remove('hidden');
            renderUpsellGroups();
        }

        function closeAdmin() {
            const modal = document.getElementById('admin-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // === FULL UPSSELL GROUPS SYSTEM ===
        function createUpsellGroup() {
            const input = document.getElementById('new-upsell-group-name');
            const name = input.value.trim();
            if (!name) return alert("Please enter a group name");

            upsellGroups.push({
                id: Date.now(),
                name: name,
                productIds: []
            });

            saveUpsellGroups();
            input.value = '';
            renderUpsellGroups();
        }

        function renderUpsellGroups() {
            const container = document.getElementById('upsell-groups-list');
            if (!container) return;
            container.innerHTML = '';

            upsellGroups.forEach(group => {
                const div = document.createElement('div');
                div.className = 'bg-slate-800 border border-slate-700 rounded-2xl p-4';
                
                let productsHTML = '';
                group.productIds.forEach(pid => {
                    const p = products.find(x => x.id === pid);
                    if (p) {
                        productsHTML += `<div class="bg-slate-700 px-3 py-1 rounded-full text-sm flex items-center gap-2 mb-1">${p.name} <span onclick="removeProductFromGroup(${group.id}, ${pid})" class="cursor-pointer text-red-400">×</span></div>`;
                    }
                });

                div.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <div class="font-semibold">${group.name}</div>
                        <button onclick="deleteUpsellGroup(${group.id})" class="text-red-400 hover:text-red-500 text-sm">Delete</button>
                    </div>
                    
                    <div class="mb-3">${productsHTML || '<div class="text-sm text-slate-400">No products in this group yet</div>'}</div>
                    
                    <select id="select-product-${group.id}" class="bg-slate-700 border border-slate-600 rounded-xl px-3 py-1 text-sm w-full mb-2">
                        <option value="">Select product to add...</option>
                    </select>
                    <button onclick="addProductToUpsellGroup(${group.id})" class="px-4 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-sm rounded-xl">Add Product</button>
                `;
                
                container.appendChild(div);
                populateProductSelect(group.id);
            });
        }

        function populateProductSelect(groupId) {
            const select = document.getElementById(`select-product-${groupId}`);
            if (!select) return;

            select.innerHTML = '<option value="">Select product to add...</option>';
            
            products.forEach(p => {
                if (p.availableAsUpsell !== false) {
                    const option = document.createElement('option');
                    option.value = p.id;
                    option.textContent = p.name;
                    select.appendChild(option);
                }
            });
        }

        function addProductToUpsellGroup(groupId) {
            const select = document.getElementById(`select-product-${groupId}`);
            const productId = parseInt(select.value);
            if (!productId) return;

            const group = upsellGroups.find(g => g.id === groupId);
            if (!group.productIds.includes(productId)) {
                group.productIds.push(productId);
                saveUpsellGroups();
                renderUpsellGroups();
            }
        }

        function removeProductFromGroup(groupId, productId) {
            const group = upsellGroups.find(g => g.id === groupId);
            group.productIds = group.productIds.filter(id => id !== productId);
            saveUpsellGroups();
            renderUpsellGroups();
        }

        function deleteUpsellGroup(groupId) {
            if (!confirm("Delete this group?")) return;
            upsellGroups = upsellGroups.filter(g => g.id !== groupId);
            saveUpsellGroups();
            renderUpsellGroups();
        }

        function saveUpsellGroups() {
            localStorage.setItem('nubz_upsell_groups', JSON.stringify(upsellGroups));
        }

        function showProductModal(product) {
            alert("Product details would open here for: " + product.name);
        }

        function showCart() {
            alert("Cart would open here");
        }

        function toggleMobileMenu() {
            // Add mobile menu logic if needed
        }

        async function initializeWebsite() {
            await loadProducts();
            
            // Load upsell groups
            const savedGroups = localStorage.getItem('nubz_upsell_groups');
            if (savedGroups) upsellGroups = JSON.parse(savedGroups);

            document.getElementById('home').classList.add('active');
        }

        window.onload = initializeWebsite;
    </script>
</body>
</html>
